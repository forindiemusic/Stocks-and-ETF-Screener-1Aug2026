# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-logger
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.10

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [
          "types-requests",
          "types-pyyaml",
          "pandas-stubs",
          "numpy",
        ]
        args: [--strict, --show-error-codes, --pretty]

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: [-r, src, -ll, -f, json, -o, bandit-report.json]
        exclude: ^tests/

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--convention=google, --match-dir=src]

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: pytest --co -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit
        entry: pip-audit --desc --format=json --output=pip-audit-report.json
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

ci:
  autofix_commit_msg: "chore: apply pre-commit auto-fixes"
  autofix_prs: true
  autoupdate_schedule: monthly
  skip: [pytest-check, pip-audit]