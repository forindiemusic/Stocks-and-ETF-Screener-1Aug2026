[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swing-agent"
version = "0.1.0"
description = "ETF and Stock Swing Trading Agent - Multi-factor screening for near-term outperformance"
readme = "README-DETAILS.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Stock Screener Project", email = "noreply@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "yfinance>=0.2.40,<0.3",
    "pandas>=2.1.0,<3.0",
    "numpy>=1.26.0,<2.0",
    "ta-lib>=0.4.28,<0.5",
    "pyyaml>=6.0.1,<7.0",
    "requests>=2.31.0,<3.0",
    "beautifulsoup4>=4.12.0,<5.0",
    "textblob>=0.17.1,<0.18",
    "rich>=13.7.0,<14.0",
    "python-dotenv>=1.0.0,<2.0",
    "schedule>=1.2.0,<2.0",
    "pydantic>=2.5.0,<3.0",
    "pydantic-settings>=2.1.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=4.1.0,<5.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-mock>=3.12.0,<4.0",
    "hypothesis>=6.92.0,<7.0",
    "black>=24.0.0,<25.0",
    "ruff>=0.3.0,<1.0",
    "mypy>=1.8.0,<2.0",
    "types-requests>=2.31.0,<3.0",
    "types-pyyaml>=6.0.0,<7.0",
    "pre-commit>=3.6.0,<4.0",
    "pip-audit>=2.7.0,<3.0",
]
backtest = [
    "matplotlib>=3.8.0,<4.0",
    "seaborn>=0.13.0,<1.0",
    "empyrical>=0.5.5,<1.0",
]
dashboard = [
    "streamlit>=1.30.0,<2.0",
    "plotly>=5.18.0,<6.0",
]

[project.scripts]
swing-agent = "swing_agent.cli:main"
swing-backtest = "swing_agent.backtest.engine:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["swing_agent*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (allow for now)
    "T201",  # print statements (allowed in CLI)
    "S101",  # assert (allowed in tests)
]
per-file-ignores = { "tests/*" = ["S101", "T201"], "scripts/*" = ["T201"] }
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "yfinance",
    "ta_lib",
    "talib",
    "textblob",
    "bs4",
    "rich",
    "schedule",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::FutureWarning:ta",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/swing_agent"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2
show_missing = true

[tool.pre-commit]
# Configuration for pre-commit hooks (also in .pre-commit-config.yaml)